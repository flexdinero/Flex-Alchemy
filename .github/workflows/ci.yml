name: Flex Alchemy tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository tests
        shell: pwsh
        run: npm test

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: alchemy-ci-only
          POSTGRES_DB: alchemy_test
        options: >-
          --health-cmd "pg_isready -U postgres -d alchemy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply migration and test workspace boundaries
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for migration in db/migrations/[0-9]*.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d alchemy_test < "$migration"
          done
          docker exec -i "$POSTGRES_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d alchemy_test < db/workspace-boundary.test.sql

  hosted-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build hosted image
        run: docker build --pull -t flex-alchemy:ci .
      - name: Verify packaged runtime
        run: |
          docker run --rm flex-alchemy:ci node --input-type=module -e "if (process.getuid() === 0) process.exit(1); const { catalogSnapshot } = await import('./apps/hosted/catalog-check.mjs'); await import('./apps/hosted/api.mjs'); await catalogSnapshot();"
          status=0
          output=$(docker run --rm flex-alchemy:ci 2>&1) || status=$?
          if [ "$status" -ne 1 ] || ! grep -Fxq 'Hosted startup failed during configuration.' <<< "$output"; then
            printf '%s\n' "$output"
            exit 1
          fi
      - name: Build and verify isolated Node worker
        run: |
          docker build -f apps/worker/Dockerfile -t flex-alchemy-node-worker .
          node apps/worker/smoke.mjs
